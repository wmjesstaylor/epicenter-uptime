name: Epicenter CDN feed probe

# External uptime probe for the Epicenter R2 CDN feed object. Lives
# OFF poseidon (on GitHub Actions) so it can detect "poseidon is
# entirely down" — the failure mode poseidon-local checks miss by
# definition. Catches:
#   - poseidon dead (curl times out / non-2xx)
#   - poseidon up but feed-builder broken (Last-Modified > 15 min ago)
#   - Cloudflare R2 incident (curl error / non-2xx)
#
# Notification: Pushover on failure (sub-second push to your phone).
# Falls back silent if Pushover secrets aren't configured — you'll
# still see the failed run in GitHub's Actions UI and get the
# default GitHub email notification on workflow failure.

on:
  schedule:
    # Every 5 minutes. Feed-builder runs every 5 too, so this matches
    # the upstream cadence. GitHub Actions cron has known imprecision
    # (up to ~15 min late during platform load); that's fine for a
    # "is poseidon dead?" check where minutes-late beats hours-late
    # which is what we'd get without any external probe.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}    # manual trigger for testing

# If a probe is still running when the next scheduled fires, skip
# the new one rather than queueing. Avoids backlog buildup if a
# notification step is slow.
concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      # Probe BOTH the canonical custom domain (what production clients
      # hit since the 2026-05-28 cutover) AND the legacy R2 URL (still
      # serves v1.9.13 and earlier). Checking the custom domain catches
      # a DNS / Cloudflare-routing break even when the underlying R2
      # object is fine — the legacy-only probe was blind to that.
      FEED_URLS: |
        https://feed.seismology.rocks/30day.geojson
        https://pub-66026398b34f4c7092ac1cec0a76eaa8.r2.dev/30day.geojson
      # 15 min — feed-builder runs every 5 min, so 15 = 3 missed
      # cycles. Tight enough to catch real outages quickly, loose
      # enough to ride out one bad cycle without false-positive.
      MAX_STALE_SEC: '900'
    steps:
      - name: Check CDN feed health
        id: check
        run: |
          set -uo pipefail

          # Record the failure reason for the Pushover step, then exit.
          fail() {
            echo "reason=$1" >> "$GITHUB_OUTPUT"
            echo "::error::$1"
            exit 1
          }

          # Here-string (not a pipe) so the loop runs in the current
          # shell and fail()'s exit propagates out of the workflow step.
          while IFS= read -r FEED_URL; do
            [ -z "$FEED_URL" ] && continue
            echo "Probing $FEED_URL"

            HEADERS=$(curl -sIL --max-time 30 "$FEED_URL") \
              || fail "curl failed contacting $FEED_URL"

            STATUS=$(echo "$HEADERS" | grep -E '^HTTP/' | tail -1 | awk '{print $2}')
            [ "$STATUS" = "200" ] || fail "$FEED_URL returned HTTP $STATUS"

            LAST_MOD=$(echo "$HEADERS" | grep -i '^last-modified:' | sed 's/^[Ll]ast-[Mm]odified:[[:space:]]*//' | tr -d '\r' | tail -1)
            [ -n "$LAST_MOD" ] || fail "Last-Modified header missing for $FEED_URL"

            LAST_EPOCH=$(date -d "$LAST_MOD" +%s 2>/dev/null) \
              || fail "Last-Modified parse failed for $FEED_URL: $LAST_MOD"

            NOW_EPOCH=$(date +%s)
            AGE_SEC=$((NOW_EPOCH - LAST_EPOCH))
            AGE_MIN=$((AGE_SEC / 60))

            [ "$AGE_SEC" -le "$MAX_STALE_SEC" ] \
              || fail "$FEED_URL is ${AGE_MIN}m stale (>$((MAX_STALE_SEC/60))m threshold)"

            echo "OK: $FEED_URL status=$STATUS age=${AGE_MIN}m"
          done <<< "$FEED_URLS"

          echo "All feeds healthy"

      - name: Notify Pushover on failure
        if: failure()
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          if [ -z "$PUSHOVER_USER_KEY" ] || [ -z "$PUSHOVER_APP_TOKEN" ]; then
            echo "::warning::Pushover secrets not configured; relying on GitHub's default failure email only"
            exit 0
          fi

          REASON_TEXT="${REASON:-unknown failure}"

          # priority=1 — high priority, bypasses Pushover quiet hours
          # but doesn't require acknowledgment (priority=2 does that
          # and is reserved for absolutely-must-act-now alerts).
          curl -s --max-time 10 \
            --form-string "token=$PUSHOVER_APP_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=Epicenter CDN feed unhealthy" \
            --form-string "message=Probe at $(date -u '+%Y-%m-%d %H:%M UTC'). Reason: $REASON_TEXT. Check poseidon." \
            --form-string "priority=1" \
            --form-string "url_title=GitHub Actions run" \
            --form-string "url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            https://api.pushover.net/1/messages.json \
            -o /tmp/pushover-response.json -w "Pushover HTTP %{http_code}\n"
          cat /tmp/pushover-response.json
